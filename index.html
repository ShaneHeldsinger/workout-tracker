<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b0f">
  <title>LIFT</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ========== WORKOUTS PAGE ========== -->
    <section id="page-workouts" class="page active">
      <header class="page-header"><h1>Workouts</h1></header>
      <div class="page-body">
        <div id="workout-list"></div>
        <div id="empty-workouts" class="empty">
          <div class="empty-icon">🏋️</div>
          <p>No workouts yet</p>
          <p class="dim">Tap + to create one</p>
        </div>
      </div>
      <button id="btn-new" class="fab" aria-label="New workout">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </section>

    <!-- ========== HISTORY PAGE ========== -->
    <section id="page-history" class="page">
      <header class="page-header">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h1>History</h1>
          <button id="btn-clear-history" class="btn-text danger" style="font-size:14px">Clear All</button>
        </div>
      </header>
      <div class="page-body">
        <div id="history-list"></div>
        <div id="empty-history" class="empty">
          <div class="empty-icon">📊</div>
          <p>No history yet</p>
          <p class="dim">Complete a workout to see it here</p>
        </div>
      </div>
    </section>

    <!-- ========== ACTIVE SESSION (overlay) ========== -->
    <div id="session" class="overlay hidden">
      <header class="session-header">
        <button id="btn-end" class="btn-text danger">End</button>
        <div id="session-timer" class="timer-display">00:00</div>
        <div style="width:48px"></div>
      </header>
      <div class="session-body">
        <div id="view-exercise">
          <span id="ex-badge" class="badge hidden"></span>
          <h2 id="ex-name"></h2>
          <div id="ex-dots" class="dots"></div>
          <p id="ex-info" class="dim"></p>
          <button id="btn-done-set" class="btn-big">Complete Set</button>
        </div>
        <div id="view-rest" class="hidden">
          <p class="rest-label">REST</p>
          <div class="ring-wrap">
            <svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="54"/><circle id="ring-fg" class="ring-fg" cx="60" cy="60" r="54"/></svg>
            <span id="rest-countdown">0:00</span>
          </div>
          <button id="btn-skip" class="btn-text">Skip</button>
          <p id="rest-next" class="dim"></p>
        </div>
        <button id="btn-undo" class="btn-undo hidden">Undo</button>
      </div>
      <div class="drawer">
        <button id="btn-toggle-drawer" class="drawer-toggle">
          <span>Exercises</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="drawer-list" class="drawer-list collapsed"></div>
      </div>
    </div>

    <!-- ========== SESSION COMPLETE (overlay) ========== -->
    <div id="session-done" class="overlay hidden">
      <div class="center-col">
        <div class="done-icon">🎉</div>
        <h2>Workout Complete!</h2>
        <p id="done-time" class="big-time"></p>
        <p id="done-summary" class="dim"></p>
        <button id="btn-finish" class="btn-primary">Done</button>
      </div>
    </div>

    <!-- ========== EDITOR (overlay) ========== -->
    <div id="editor" class="overlay hidden">
      <header class="overlay-header">
        <button id="btn-cancel" class="btn-text">Cancel</button>
        <h2 id="editor-title">New Workout</h2>
        <button id="btn-save" class="btn-text primary">Save</button>
      </header>
      <div class="overlay-body">
        <label class="field-label">Workout Name</label>
        <input type="text" id="inp-name" placeholder="e.g. Push Day" autocomplete="off">
        <div class="section-row">
          <h3>Exercises</h3>
          <button id="btn-add-ex" class="btn-small">+ Add</button>
        </div>
        <div id="ex-list"></div>
      </div>
    </div>

    <!-- ========== CONFIRM DIALOG ========== -->
    <div id="confirm" class="dialog-bg hidden">
      <div class="dialog">
        <p id="confirm-msg"></p>
        <div class="dialog-actions">
          <button id="confirm-no" class="btn-text">Cancel</button>
          <button id="confirm-yes" class="btn-text danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div id="toast" class="toast hidden"></div>

    <!-- ========== BOTTOM NAV ========== -->
    <nav id="nav">
      <button class="nav-btn active" data-page="workouts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Workouts</span>
      </button>
      <button class="nav-btn" data-page="history">
        <svg width="22" height="22" viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
